{% extends "base.html" %}

{% block title %}Bienvenido | bkHabit{% endblock %}

{% block content %}
<section class="py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5 text-center">
                    <h1 class="display-6 fw-bold mb-3">Construye hábitos que sí se mantienen</h1>
                    <p class="lead text-secondary mb-4">
                        bkHabit te ayuda a crear constancia diaria y seguir tu progreso de forma simple.
                    </p>
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a href="{% url 'signup' %}" class="btn btn-primary btn-lg px-4">Crear cuenta</a>
                        <a href="{% url 'login' %}" class="btn btn-outline-primary btn-lg px-4">Iniciar sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
